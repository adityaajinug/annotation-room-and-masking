<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Texture Preview 2</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style2.css">
</head>
<body>
  <header class="topbar">
    <h1>Room Texture Preview</h1>
  </header>

  <div class="notice" id="notice" hidden>
    <p>No project yet. Upload a photo and add surfaces in the admin first.</p>
    <a class="btn primary" href="admin-2.html">Open admin-2</a>
  </div>

  <main class="layout" id="layout" hidden>
    <aside class="panel">
      <div id="surface-chip"></div>
      <h2>Textures</h2>
      <ul id="product-list" class="products"></ul>
    </aside>

    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="cv-original"></canvas>
        <canvas id="cv-result" hidden></canvas>
      </div>
      <p class="status" id="status">Loading…</p>
    </section>
  </main>

  <script src="js/mask.js"></script>
  <script src="js/render.js"></script>
  <script src="js/store2.js"></script>
  <script src="js/view2.js"></script>
</body>
</html>
